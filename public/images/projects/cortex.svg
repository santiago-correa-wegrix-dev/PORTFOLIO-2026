<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0d0618"/>

  <!-- Grid lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Neural connections -->
  <line x1="120" y1="140" x2="240" y2="200" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="240" y1="200" x2="400" y2="160" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="400" y1="160" x2="560" y2="220" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="560" y1="220" x2="680" y2="160" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="120" y1="140" x2="400" y2="340" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="240" y1="200" x2="560" y2="340" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="400" y1="160" x2="680" y2="340" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="120" y1="360" x2="400" y2="340" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1.5"/>
  <line x1="400" y1="340" x2="680" y2="360" stroke="#7c3aed" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Nodes -->
  <circle cx="120" cy="140" r="5" fill="#7c3aed" opacity="0.6"/>
  <circle cx="240" cy="200" r="4" fill="#a855f7" opacity="0.5"/>
  <circle cx="400" cy="160" r="6" fill="#7c3aed" opacity="0.7"/>
  <circle cx="560" cy="220" r="4" fill="#a855f7" opacity="0.5"/>
  <circle cx="680" cy="160" r="5" fill="#7c3aed" opacity="0.6"/>
  <circle cx="120" cy="360" r="4" fill="#6d28d9" opacity="0.5"/>
  <circle cx="400" cy="340" r="6" fill="#7c3aed" opacity="0.6"/>
  <circle cx="680" cy="360" r="4" fill="#6d28d9" opacity="0.5"/>

  <!-- Glow behind title -->
  <ellipse cx="400" cy="250" rx="220" ry="80" fill="#7c3aed" opacity="0.07"/>

  <!-- CORTEX title -->
  <text
    x="400"
    y="268"
    font-family="'Inter', 'SF Pro Display', system-ui, sans-serif"
    font-size="96"
    font-weight="800"
    fill="white"
    text-anchor="middle"
    letter-spacing="-4"
    opacity="0.95"
  >CORTEX</text>

  <!-- Coming soon label -->
  <rect x="336" y="295" width="128" height="24" rx="12" fill="#7c3aed" opacity="0.2"/>
  <text
    x="400"
    y="311"
    font-family="'Inter', system-ui, sans-serif"
    font-size="10"
    font-weight="500"
    fill="#a855f7"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.9"
  >COMING SOON</text>
</svg>
